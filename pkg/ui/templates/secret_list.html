{{define "title"}}Auth Secrets{{end}}
{{define "content"}}
<h1>Auth Secrets</h1>
<div class="toolbar">
  <a class="btn primary" href="/secrets/new">New auth secret</a>
</div>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .SecretRows}}
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Keys</th>
      <th>Age</th>
    </tr>
  </thead>
  <tbody>
  {{range .SecretRows}}
    <tr>
      <td>{{.Name}}</td>
      <td>{{.Keys}}</td>
      <td>{{.Age}}</td>
    </tr>
  {{end}}
  </tbody>
</table>
{{else}}
<p class="muted">No harness auth secrets in namespace {{.Namespace}}.</p>
{{end}}
{{end}}
