{{define "title"}}New Auth Secret{{end}}
{{define "content"}}
<h1>New Auth Secret</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<p class="muted">Creates an Opaque Secret with keys <code>kubeconfig</code>, <code>admin</code>, and <code>users</code>, labeled for the harness auth picker.</p>
<form class="stack" method="post" action="/secrets">
  <label for="name">Name *</label>
  <input id="name" name="name" required pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" placeholder="ephemeral-cluster-auth">

  <label for="kubeconfig">kubeconfig *</label>
  <textarea id="kubeconfig" name="kubeconfig" required rows="12" placeholder="apiVersion: v1&#10;kind: Config&#10;..."></textarea>

  <label for="admin">admin * <span class="muted">(kubeadmin:password)</span></label>
  <input id="admin" name="admin" required placeholder="kubeadmin:password">

  <label for="users">users * <span class="muted">(comma-separated user:pass)</span></label>
  <textarea id="users" name="users" required rows="3" placeholder="testuser-1:pass1,testuser-2:pass2,..."></textarea>

  <div class="toolbar" style="margin-top:1.25rem">
    <button class="btn primary" type="submit">Create secret</button>
    <a class="btn" href="/secrets">Cancel</a>
  </div>
</form>
{{end}}
